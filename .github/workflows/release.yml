# Tag -> pack -> GitHub Packages -> GitHub Release.
#
# Pushing a tag such as v1.28.0-preview.1 runs the whole CI matrix first and
# then publishes every package of the set under the version the tag names,
# and finally cuts the GitHub release of the tag with the packages attached.
# Nothing is published from a branch: the tag is the only trigger.
#
# The push target is https://nuget.pkg.github.com/masa-iwm/index.json, a feed
# that needs authentication
# even for public packages. GITHUB_TOKEN of this repository is enough for the
# push; consumers need a token with read:packages.
name: Release

on:
  push:
    tags: ['v*']

# A single tag never publishes twice at the same time, and a running publish
# is never cancelled: a half pushed set is worse than a slow one. Distinct
# tags may run in parallel; they publish distinct versions and share no state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same gates a branch gets. A release is rare, so it pays for the full
  # matrix rather than for a shortened copy of it.
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    name: pack and push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # contents: write is what lets the last step create the GitHub release.
      contents: write
      packages: write

    steps:
      # fetch-depth: 0 is what the release notes need: the whole history and
      # every tag, so that the previous tag can be found and the commits
      # between it and this one listed. A shallow clone knows neither.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tag is the single source of the version, so it has to be a version:
      # v<major>.<minor>.<patch>[-prerelease].
      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag (expected v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${tag#v}."

      # Every packable project of the solution, so that this workflow does not
      # have to be edited when the package set changes. The samples and the
      # test projects set IsPackable=false and produce nothing.
      #
      # RepositoryUrl is passed on the command line because GitHub Packages
      # rejects a package it cannot link to a repository; when the project
      # files already set it, this passes the same value again.
      - name: Pack
        run: >
          dotnet pack GstSharp.Net.slnx
          --configuration Release
          --output artifacts/dist
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl=https://github.com/${{ github.repository }}
          -p:RepositoryType=git

      # The count is frozen the same way the census tests freeze the generated
      # surface: a package that silently falls out of the solution (or joins
      # it) must fail the publish, not ship an unintended set.
      - name: Check the package count
        run: |
          expected=12
          actual=$(ls artifacts/dist/*.nupkg | wc -l)
          if [[ "$actual" -ne "$expected" ]]; then
            echo "::error::Expected $expected packages, found $actual:"
            ls -l artifacts/dist
            exit 1
          fi
          echo "All $expected packages are present."
          ls -l artifacts/dist

      # Keep the packages whatever the push does: a rejected push must not cost
      # the artifacts of a green build. There are no symbol packages to
      # collect: the debugging symbols are embedded in the assemblies
      # (src/Directory.Build.props), which is the only form that helps on a
      # feed without a symbol server. overwrite lets a re-run of the job get
      # past this step instead of dying on the artifact its first attempt left.
      - name: Upload the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: artifacts/dist/*.nupkg
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      # --no-symbols: defensive only - nothing produces a .snupkg, and the
      # feed would reject one anyway.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/dist/*.nupkg"
          --source https://nuget.pkg.github.com/masa-iwm/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols

      # The release is where the packages can be downloaded without a token:
      # the GitHub Packages feed above needs authentication even when the
      # repository is public, so the attached .nupkg files are the no-auth
      # path; their assemblies carry the symbols embedded. A tag with a
      # prerelease suffix is marked as a prerelease. When the release already
      # exists, a re-run re-uploads the assets instead of failing or stopping
      # short: that repairs a release a broken upload left incomplete, the
      # same stance --skip-duplicate takes for the feed.
      #
      # The body is written here rather than left to --generate-notes, which
      # has nothing to summarize in a repository that lands its work on main
      # directly: it would produce the compare link and nothing else. So the
      # commit subjects since the previous tag go in front of that link. The
      # very first tag has no previous tag to diff against and keeps the
      # generated notes, which is exactly the compare-link-only body.
      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $tag already exists; refreshing its assets."
            gh release upload "$tag" --repo "${{ github.repository }}" \
              --clobber artifacts/dist/*.nupkg
            exit 0
          fi
          prerelease=""
          if [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          notes=(--generate-notes)
          previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          if [[ -n "$previous" ]]; then
            echo "Listing the commits of $previous..$tag."
            {
              echo "## Changes"
              echo
              git log "$previous..$tag" --format='- %s'
              echo
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$previous...$tag"
            } > "$RUNNER_TEMP/release-notes.md"
            cat "$RUNNER_TEMP/release-notes.md"
            notes=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            echo "No previous tag; falling back to the generated notes."
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            "${notes[@]}" \
            --verify-tag \
            $prerelease \
            artifacts/dist/*.nupkg
