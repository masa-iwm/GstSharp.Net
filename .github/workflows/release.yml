# Tag -> pack -> GitHub Packages -> GitHub Release.
#
# Pushing a tag such as v1.28.0-preview.1 runs the whole CI matrix first and
# then publishes every package of the set under the version the tag names,
# and finally cuts the GitHub release of the tag with the packages attached.
# Nothing is published from a branch: the tag is the only trigger.
#
# The push target is https://nuget.pkg.github.com/masa-iwm/index.json, a feed
# that needs authentication
# even for public packages. GITHUB_TOKEN of this repository is enough for the
# push; consumers need a token with read:packages.
name: Release

on:
  push:
    tags: ['v*']

# Two tags must never publish at the same time, and a running publish is never
# cancelled: a half pushed set is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The same gates a branch gets. A release is rare, so it pays for the full
  # matrix rather than for a shortened copy of it.
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    name: pack and push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      # contents: write is what lets the last step create the GitHub release.
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The tag is the single source of the version, so it has to be a version:
      # v<major>.<minor>.<patch>[-prerelease].
      - name: Read the version from the tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$tag' is not a version tag (expected v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${tag#v}."

      # Every packable project of the solution, so that this workflow does not
      # have to be edited when the package set changes. The samples and the
      # test projects set IsPackable=false and produce nothing.
      #
      # RepositoryUrl is passed on the command line because GitHub Packages
      # rejects a package it cannot link to a repository; when the project
      # files already set it, this passes the same value again.
      - name: Pack
        run: >
          dotnet pack GstSharp.Net.slnx
          --configuration Release
          --output artifacts/dist
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true
          -p:RepositoryUrl=https://github.com/${{ github.repository }}
          -p:RepositoryType=git

      - name: List the packages
        run: ls -l artifacts/dist

      # Keep the packages whatever the push does: a rejected push must not cost
      # the artifacts of a green build. Symbol packages are collected here as
      # well, because the feed does not take them (see below).
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ steps.version.outputs.version }}
          path: |
            artifacts/dist/*.nupkg
            artifacts/dist/*.snupkg
          if-no-files-found: error
          retention-days: 30

      # --no-symbols: GitHub Packages has no symbol server, and dotnet nuget
      # push would otherwise upload the .snupkg next to each .nupkg and fail on
      # it. Symbols travel as the build artifact above instead.
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "artifacts/dist/*.nupkg"
          --source https://nuget.pkg.github.com/masa-iwm/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
          --no-symbols

      # The release is where the packages can be downloaded without a token:
      # the GitHub Packages feed above needs authentication even when the
      # repository is public, so the attached .nupkg files are the no-auth
      # path, and the .snupkg symbols ride along. A tag with a prerelease
      # suffix is marked as a prerelease. Skipping an existing release keeps a
      # re-run of a green publish from failing at its last step, the same
      # stance --skip-duplicate takes for the feed.
      - name: Cut the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $tag already exists; leaving it as it is."
            exit 0
          fi
          prerelease=""
          if [[ "$tag" == *-* ]]; then
            prerelease="--prerelease"
          fi
          gh release create "$tag" \
            --repo "${{ github.repository }}" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            $prerelease \
            artifacts/dist/*.nupkg artifacts/dist/*.snupkg
