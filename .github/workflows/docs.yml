# The documentation site.
#
# One docfx run turns two things into a static site: the XML documentation of
# the eighteen packable projects, extracted by `docfx metadata` into an API
# reference, and the hand-written Markdown of `docs/` plus the README. The
# result is uploaded as a Pages artifact and deployed by the second job.
#
# The site is published from `main` only, so it always describes the tip of the
# branch rather than the latest release; `docfx/index.md` says so on the front
# page.
#
# This workflow needs GitHub Pages to be configured with the build type
# "GitHub Actions" (Settings → Pages → Build and deployment → Source). With the
# legacy branch source the deploy step fails, because the environment that
# `actions/deploy-pages` writes to does not exist.
#
# CONTRIBUTING.md has the local preview, and eng/ci-notes.md explains why the
# workflows look the way they do.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one half way: an interrupted
# deploy would leave the published site in an undefined state.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # docfx is pinned in .config/dotnet-tools.json.
      - name: Restore tools
        run: dotnet tool restore

      # `metadata` compiles the eighteen projects and `build` renders the site.
      # The run ends with warnings and still exits 0. Most of them are links in
      # the generated XML documentation to native C symbols that have no page
      # here; the rest are pre-existing duplicate-source and duplicated-member
      # warnings from loading the projects. eng/ci-notes.md lists them.
      - name: Build site
        run: dotnet docfx docfx/docfx.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docfx/_site

  deploy:
    name: deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
