# Push and pull request gates.
#
# The jobs are split by what they need from the machine:
#
#   verify            no native GStreamer at all: generator drift, a
#                     warning-free build, every test suite that runs against
#                     fakes rather than against the library, and the pack that
#                     validates the surface against the published baseline.
#   linux             the Linux SONAME path of the native loader, the only
#                     plugin set complete enough to run the WebRTC tests, and
#                     the linux-x64 NativeAOT gate.
#   macos             the macOS dylib path of the native loader.
#   windows-mingw     the MinGW flavor, found the way a developer with MSYS2
#                     finds it: from the process search path, with no
#                     environment variable to help it.
#   windows-msvc-aot  the MSVC flavor plus the two win-x64 NativeAOT gates.
#
# eng/ci-notes.md explains every installation strategy, the pinned versions and
# how to run the same gate on a development machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml, so that a tag runs the same gates as a branch.
  workflow_call:
  workflow_dispatch:

# Only the newest commit of a branch or pull request has to be green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # --------------------------------------------------------------------------
  # Everything that holds without a GStreamer installation.
  # --------------------------------------------------------------------------
  verify:
    name: verify (no native)
    runs-on: ubuntu-latest
    # 20 rather than 15 since the surface check at the end of the job joined
    # it: packing in Release compiles the whole solution a second time, which
    # the rest of the leg does not.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      # The generated sources are committed, so the gate is that regenerating
      # them changes nothing: 408 files plus girs/skip-report.md, which the
      # generator writes next to the gir files it was derived from.
      - name: Generator drift
        run: dotnet run --project generator/GstSharp.Generator --no-restore -- verify --gir-dir girs --out-dir src

      # TreatWarningsAsErrors is already on in Directory.Build.props. The
      # -warnaserror switch additionally promotes MSBuild and NuGet warnings,
      # which this repository also keeps at zero.
      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore -warnaserror

      - name: Test the generator
        run: dotnet test tests/GstSharp.Generator.Tests --no-restore --logger "trx;LogFileName=generator.trx" --results-directory artifacts/test-results

      - name: Test the analyzers
        run: dotnet test tests/GstSharp.Analyzers.Tests --no-restore --logger "trx;LogFileName=analyzers.trx" --results-directory artifacts/test-results

      # GstSharp.Core.Tests is native free by construction: the loader rules run
      # against FakePlatformProbe and the marshalling tests stop before the
      # first call into GLib. Running them on a machine without GStreamer is
      # what keeps that true.
      - name: Test the runtime (proves it needs no GStreamer)
        run: dotnet test tests/GstSharp.Core.Tests --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      # The compatibility gate, and the reason it runs here rather than at
      # release time only: EnablePackageValidation is a pack-time check
      # (src/Directory.Build.props), so without this step a removed member
      # would sit on main until a tag went out and then fail the publish, with
      # the surface already promised. Every push proves instead that every
      # package with a published baseline still contains everything that
      # baseline shipped. A module added since the baseline turns package
      # validation off in its own project until its first release is on
      # nuget.org; eng/ci-notes.md says why.
      #
      # The version is a marker, not a release: 1.28.999-surface-check sorts
      # above anything the series will ever tag, so a stray package from this
      # step cannot be mistaken for one, and nothing is pushed anywhere - the
      # packages are written into artifacts/ and thrown away with the runner.
      # The invocation is otherwise the release job's, minus the arguments that
      # only the GitHub Packages feed needs.
      - name: Pack against the published surface
        run: >
          dotnet pack GstSharp.Net.slnx
          --no-restore
          --configuration Release
          --output artifacts/surface-check
          -p:Version=1.28.999-surface-check

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-verify
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Linux: the loader resolves libgstreamer-1.0.so.0 by SONAME through the
  # dynamic linker, which no other job exercises. The runner is pinned to
  # 24.04 because its GStreamer 1.24 is the floor the ABI probes assert
  # against; ubuntu-latest would silently lift that floor.
  # --------------------------------------------------------------------------
  linux:
    name: linux (GStreamer from apt)
    runs-on: ubuntu-24.04
    # 30 rather than 20 since the NativeAOT publish at the end of the job
    # joined it: ILC compiles and links a native binary, which the rest of the
    # leg does not.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # Runtime packages only: the binding loads versioned SONAMEs
      # (libgstreamer-1.0.so.0, libgstapp-1.0.so.0), which the runtime packages
      # provide. The -dev packages would only add headers and the unversioned
      # symlinks, neither of which is used. libgstwebrtc-1.0.so.0 is what the
      # bad libraries package is here for: the GstWebRTC binding registers its
      # types from a module initialiser, so the library has to be resolvable
      # whatever else is installed. libges-1.0-0 is the same story twice: it
      # carries libges-1.0.so.0 for the registry freeze, and the nle and ges
      # plugins beside it, which ges_init needs before a timeline can be built
      # at all.
      #
      # This is also the one leg that takes the bad *plugins* and not only their
      # libraries, and it takes them for a single element: webrtcbin. Everywhere
      # else the plugins are left out because they cost fifty packages and buy
      # the binding nothing, with the result that every WebRTC test was skipped
      # on every leg — a guard that never runs guards nothing. gstreamer1.0-nice
      # is the other half of that element: webrtcbin is findable without it but
      # cannot leave the NULL state, because it builds its transports out of
      # nicesrc and nicesink. gstreamer1.0-alsa is here for one element for the
      # same reason: alsasink is the audio sink the AudioBaseSink tests build
      # theirs out of, Ubuntu ships neither it nor pulsesink in the base plugin
      # package, and without it all four of those tests skipped here too.
      # libgstrtspserver-1.0-0 is the library of the RTSP server, which apt
      # ships apart from the core packages: the module registration test loads
      # it on this leg and has no skip path.
      # What this leg now promises is asserted rather than
      # assumed; see the integration test step below.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libges-1.0-0 \
            libgstrtspserver-1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-nice \
            gstreamer1.0-alsa \
            gstreamer1.0-tools
          gst-inspect-1.0 --version

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      - name: Test the runtime
        run: dotnet test tests/GstSharp.Core.Tests --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      # GSTSHARP_REQUIRED_ELEMENTS is the promise this leg makes about its
      # installation, and RequiredElementsTests is what holds it to it: these
      # twelve factories are the ones the tests gate on with RequiresElementFact
      # that only a plugin set this leg installs on purpose provides — three for WebRTC,
      # audiomixer for the only boxed valued property the integration suite
      # writes, theoraenc and vorbisenc for the two encoders whose set_headers
      # hands a list over, theoradec for the decoder the VideoCodecFrame
      # user data tests borrow a frame from, uritranscodebin with
      # transcodebin for the transcode plugin the GstTranscoder tests build
      # their transcoder out of, and oggmux for the muxer that PbutilsTests
      # needs beside vorbisenc before a serialised encoding profile parses
      # into a container at all, and rtpL16pay for the payloader the GstRtp
      # tests read as an RTPBasePayload, and alsasink for the audio sink the
      # AudioBaseSink tests build theirs out of, which they only ever
      # construct — the device is opened by the ring buffer on the way out of
      # NULL and those tests never take the sink there — so the day
      # gstreamer1.0-plugins-bad, gstreamer1.0-nice, gstreamer1.0-alsa,
      # gstreamer1.0-plugins-good or gstreamer1.0-plugins-base stops
      # providing one of them this step turns
      # red instead of quietly downgrading those tests to skips. The variable
      # is scoped to this step because it is a statement about the suite that
      # reads it, and it is set on this leg alone because this is the only leg
      # that installs the plugins.
      #
      # --blame-hang names the test that stopped making progress: without it a
      # hung leg is killed by timeout-minutes, and the upload steps are gated
      # on `if: ${{ failure() }}`, which a cancellation by the job cap does not
      # satisfy - an always() step would still run, a failure() one does not -
      # so the run ends with a red job and no culprit. The per-test budget is
      # five minutes on every leg. The integration step finishes in well under
      # a minute on all three of them - around twenty seconds on the last green
      # run - so five minutes per test is a hang rather than a slow test, and
      # it still leaves the thirty minute job cap room for the dump to be
      # written and uploaded. The dump is a mini one: the sequence file already
      # names the test, a mini dump keeps every thread stack, which is what a
      # hang is read from, and a full dump of a process with GStreamer loaded
      # is large enough to slow the upload down for nothing. The sequence file
      # and the dump land in --results-directory, which is the directory the
      # upload step already takes.
      - name: Test against the installation
        env:
          GSTSHARP_REQUIRED_ELEMENTS: webrtcbin,nicesrc,dtlssrtpenc,audiomixer,theoraenc,theoradec,vorbisenc,uritranscodebin,transcodebin,oggmux,rtpL16pay,rtspsrc,alsasink,volume,videoconvert,rawaudioparse,vorbisdec
        run: dotnet test tests/GstSharp.IntegrationTests --no-restore --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      # The whole consumer path without AOT: parse a pipeline, cast the sink
      # through the GType registry, read every frame through a span.
      - name: AppSinkSpans
        run: dotnet run --project samples/AppSinkSpans --no-restore -- --mode pull

      # The RTP module on the same route: a payloader feeding an appsink, every
      # header read through a mapped RTPBuffer, and a compound RTCP packet
      # built and read back.
      - name: RtpPacketDump
        run: dotnet run --project samples/RtpPacketDump --no-restore

      # The gst-launch port, run headless three ways: the plain end of stream,
      # the buffering state machine, and the interrupt, which travels through a
      # GstLaunchInterrupt application message and out again as an injected EOS.
      # This is the leg that proves the POSIX side of the sample — the SIGHUP
      # and SIGQUIT registrations are installed on every run here. Each line is
      # an exit code gate; videotestsrc, queue2 and fakesink come from the core
      # and base plugins this job already installs.
      - name: GstLaunch
        run: |
          dotnet run --project samples/GstLaunch --no-restore -- videotestsrc num-buffers=100 ! fakesink
          dotnet run --project samples/GstLaunch --no-restore -- --no-position videotestsrc num-buffers=60 ! queue2 use-buffering=true max-size-buffers=0 max-size-bytes=0 max-size-time=1000000000 ! fakesink sync=true
          dotnet run --project samples/GstLaunch --no-restore -- -m -e --interrupt-after 1 videotestsrc ! fakesink

      # The gst-typefind port. The media is made here rather than fetched: the
      # first line writes a wav with the GstLaunch sample, the second identifies
      # it. --fail-on-unknown is what turns this into a gate — the C tool exits
      # 0 even for a file it could not identify, so without it the step would
      # only prove that nothing crashed. The detected type is on the log line.
      - name: GstTypefind
        run: |
          dotnet run --project samples/GstLaunch --no-restore -- -q audiotestsrc num-buffers=50 ! wavenc ! filesink location=typefind-sample.wav
          dotnet run --project samples/GstTypefind --no-restore -- --fail-on-unknown typefind-sample.wav

      # The appsrc port of the same idea, from the other end: the application is
      # the source and pushes only while appsrc asks it to. --output turns the
      # run into a byte count gate as well — what the file weighs has to be what
      # was pushed — and filesink and audioconvert are core and base elements
      # this job already has.
      - name: AppSrcPush
        run: dotnet run --project samples/AppSrcPush --no-restore -- --buffers 200 --output appsrc-push.raw

      # The ported GStreamer tutorials. All nine are built by the solution on
      # every leg; these seven are the ones that can also run, and they run here
      # rather than anywhere else because this leg has the richest plugin set
      # and no GUI to tempt them.
      #
      # --headless is the sample-only option that swaps every automatic sink
      # for a fakesink and bounds a source that has no end of its own: an audio
      # sink in a session with no sound daemon does not fail, it waits, which
      # is the lesson the device monitor step below records. Each line is an
      # exit code gate.
      #
      # The media is made here rather than fetched. Ten seconds of Theora and
      # Vorbis in an Ogg container is a real file with two streams, which is
      # what tutorial 3 needs to have a pad to ignore, tutorial 4 and 13 need to
      # have something to seek in, and tutorial 9 needs to have a topology to
      # walk. theoraenc, vorbisenc and oggmux are all in gst-plugins-base, which
      # this job installs.
      #
      # Tutorial 9 takes no --headless: it builds no sink at all, only a
      # discoverer, and its gate is its own exit code — a URI that was not
      # understood is a failure there rather than a printed line.
      #
      # Not run: tutorial 1, whose default media is an https URI, and tutorial
      # 6, whose interesting output is the caps a real audio sink negotiates.
      - name: Basic tutorials
        run: |
          dotnet run --project samples/GstLaunch --no-restore -- -q videotestsrc num-buffers=300 ! video/x-raw,width=320,height=240,framerate=30/1 ! videoconvert ! theoraenc ! oggmux name=mux ! filesink location=tutorial-media.ogg audiotestsrc num-buffers=430 ! audioconvert ! vorbisenc ! mux.
          dotnet run --project samples/tutorials/BasicTutorial02 --no-restore -- --headless
          dotnet run --project samples/tutorials/BasicTutorial03 --no-restore -- --headless tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial04 --no-restore -- --headless --seek-at 1 --seek-to 7 tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial07 --no-restore -- --headless --buffers 200
          dotnet run --project samples/tutorials/BasicTutorial08 --no-restore -- --headless --chunks 200
          dotnet run --project samples/tutorials/BasicTutorial09 --no-restore -- tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial13 --no-restore -- --headless --keys SsPNNPDq tutorial-media.ogg

      # The gst-discoverer port, run against both files the steps above made:
      # the wav for a single elementary stream and the ogg for a container with
      # a video and an audio stream under it, which is what exercises the
      # topology walk. --fail-on-error is the gate — the C tool exits 0 for a
      # URI it could not discover — and --verbose --toc puts the tag and table
      # of contents paths on the log line as well.
      #
      # This is the leg that has the plugins for it: wavparse comes from
      # gst-plugins-good, oggdemux, theoradec, vorbisdec and uridecodebin from
      # gst-plugins-base, and typefind from core.
      - name: GstDiscoverer
        run: |
          dotnet run --project samples/GstDiscoverer --no-restore -- --fail-on-error typefind-sample.wav
          dotnet run --project samples/GstDiscoverer --no-restore -- --fail-on-error --verbose --toc tutorial-media.ogg

      # The gst-play port, backed by the Play object of GstSharp.Net.Play rather
      # than by a playbin of its own. It runs against the ogg the tutorial step
      # made, which is the file with both an audio and a video stream in it, so
      # that both sinks and the media info summary have something to report.
      # --duration bounds the run and the two fakesinks keep it headless, which
      # is what makes the line an exit code gate; the second line proves the
      # hand-written visualization enumeration on an installation that has the
      # bad plugins. playbin3 comes from gst-plugins-base, which this job
      # installs.
      - name: GstPlay
        run: |
          dotnet run --project samples/GstPlay --no-restore -- --duration 2 --videosink fakesink --audiosink fakesink tutorial-media.ogg
          dotnet run --project samples/GstPlay --no-restore -- --list-visualizations

      # The plain application sample: a pipeline built from a description and
      # driven from a polled bus, with no main loop and no signal handler
      # anywhere in it. It is run without a URI, which is the mode that has an
      # exit code to gate — the built in description ends after 300 buffers of
      # videotestsrc into a fakesink, so the step passes only when the bus
      # reported end of stream, and --timeout bounds the wait either way.
      #
      # It is not run against tutorial-media.ogg, although the file exists at
      # this point of the job. The sample hands its argument to playbin
      # verbatim, so the media would have to be spelled as a file:// URI in
      # three different shells, and it offers no sink override: playbin would
      # build an autovideosink and an autoaudiosink, and a hosted runner has
      # neither a display nor a sound card to give them.
      - name: PlaybinPlayer
        run: dotnet run --project samples/PlaybinPlayer --no-restore -- --timeout 30

      # The test-launch port: an RTSP server that mounts one factory, serves it
      # and stops itself again in the order docs/ownership.md prescribes. No
      # client is attached, so what the step gates is the server half, which is
      # the part this binding owns by hand: the mounted factory survives the
      # mount with its handler on it, Attach answers a source, Detach takes it
      # off the sample's own context again and the wait for the clients to
      # finish closing ends. Nothing of the launch line is instantiated without
      # a client, so no plugin beyond the RTSP server library itself is needed
      # here; a real client playing a real mount is what the integration tests
      # do. --timeout 5 is what ends the step, since the sample serves until
      # Ctrl-C otherwise, and --port 0 lets the operating system pick the
      # port so the step never collides with whatever else the runner has
      # bound.
      - name: RtspServer
        run: dotnet run --project samples/RtspServer --no-restore -- --port 0 --timeout 5

      # The inspect-lite port, run the two ways it can be run. The census walks
      # the whole registry and needs no plugin in particular; the element page
      # is asked for fakesink, which is in the core elements every leg has, and
      # exits 1 for a name the registry does not know — which is what makes the
      # second line a gate rather than a print. This step runs on all three
      # native legs, because what it exercises is the registry surface and that
      # is where the three installations differ most.
      - name: GstInspect
        run: |
          dotnet run --project samples/GstInspect --no-restore
          dotnet run --project samples/GstInspect --no-restore -- fakesink

      # The Linux half of the NativeAOT promise. Both AOT gates used to run on
      # win-x64 alone, which left the ILC toolchain, the native link and the
      # SONAME resolution of a published binary — an executable with no host and
      # no deps.json beside it — unmeasured on the other platform the binding
      # claims. eng/aot-gate.ps1 is RID agnostic (the only thing it decides from
      # the RID is the .exe suffix of the file it runs), pwsh is on the ubuntu
      # images, and what ILC needs to link, clang and zlib, is preinstalled
      # there as well. The run half of the gate has a library to load because
      # this job installed one, and AotSmoke needs nothing beyond it: core,
      # base, controller and the fakesink of the core elements.
      #
      # Only AotSmoke is gated here, and not the AppSinkSpans gate the MSVC job
      # runs beside it. What the second gate measures is the GType registry
      # under full trimming, and that is a decision ILC makes from the same IL
      # on every RID; what is genuinely per-RID is loading and linking, which
      # AotSmoke covers — it initialises, resolves its own LibraryImport stubs,
      # runs a pipeline of two managed subclasses and reaches into a second
      # binding module. A second ILC publish would roughly double the minutes
      # this leg spends to say that again.
      #
      # Last of the steps on purpose: an ILC publish takes minutes, and a plain
      # test or sample failure belongs on the log before it, not behind it.
      - name: NativeAOT smoke (linux-x64)
        shell: pwsh
        run: ./eng/aot-gate.ps1 -Project samples/AotSmoke -Rid linux-x64

      # The gst-device-monitor port. A hosted runner has no capture or playback
      # hardware, so finding zero devices is the expected outcome and is exit 0,
      # exactly as it is for the C tool. What is being gated is that the monitor
      # starts at all: gst_device_monitor_start returns FALSE, and the tool -1,
      # when no device provider matches the filters, so this would catch a leg
      # that lost its providers.
      #
      # Not run here after all: the pulse provider of gst-plugins-good hangs
      # a headless session without a PulseAudio daemon - both attempts sat in
      # start until the job timeout. The macOS leg keeps this gate; its
      # osxaudio provider comes up without a daemon to wait for.

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-linux
          # artifacts/logs is where aot-gate.ps1 tees the publish output, so a
          # failed AOT gate leaves the same artifact behind here as on the MSVC
          # job.
          path: |
            artifacts/test-results
            artifacts/logs
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # macOS: the dylib file names and the Homebrew directory of the unix planner.
  # --------------------------------------------------------------------------
  macos:
    name: macos (GStreamer from Homebrew)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The formula bundles core, base, good, bad, ugly and libav, and installs
      # into /opt/homebrew/lib on the arm64 runners, which is one of the
      # directories NativeInstallPlanner.EnumerateUnixDirectories tries. The
      # editing services are part of it as well — the formula absorbed the
      # former gst-editing-services one and links lib/libges* — so the GES job
      # needs nothing of its own here.
      - name: Install GStreamer
        run: |
          brew install gstreamer
          gst-inspect-1.0 --version

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      - name: Test the runtime
        run: dotnet test tests/GstSharp.Core.Tests --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      - name: Test against the installation
        run: dotnet test tests/GstSharp.IntegrationTests --no-restore --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: AppSinkSpans
        run: dotnet run --project samples/AppSinkSpans --no-restore -- --mode pull

      # The RTP module on the same route: a payloader feeding an appsink, every
      # header read through a mapped RTPBuffer, and a compound RTCP packet
      # built and read back.
      - name: RtpPacketDump
        run: dotnet run --project samples/RtpPacketDump --no-restore

      - name: GstLaunch
        run: dotnet run --project samples/GstLaunch --no-restore -- videotestsrc num-buffers=100 ! fakesink

      # Same two ports as the Linux leg; see the comments there. The device
      # provider that keeps the monitor startable here is osxaudio, out of
      # gst-plugins-good, which the formula bundles.
      - name: GstTypefind
        run: |
          dotnet run --project samples/GstLaunch --no-restore -- -q audiotestsrc num-buffers=50 ! wavenc ! filesink location=typefind-sample.wav
          dotnet run --project samples/GstTypefind --no-restore -- --fail-on-unknown typefind-sample.wav

      # Same port as the Linux leg; see the comments there. The media here is
      # the wav the step above made rather than the ogg, which only the Linux
      # leg builds.
      - name: GstPlay
        run: |
          dotnet run --project samples/GstPlay --no-restore -- --duration 2 --videosink fakesink --audiosink fakesink typefind-sample.wav
          dotnet run --project samples/GstPlay --no-restore -- --list-visualizations

      # Same run as the Linux leg; see the comments there.
      - name: PlaybinPlayer
        run: dotnet run --project samples/PlaybinPlayer --no-restore -- --timeout 30

      # Same run as the Linux leg; see the comments there.
      - name: RtspServer
        run: dotnet run --project samples/RtspServer --no-restore -- --port 0 --timeout 5

      - name: GstDeviceMonitor
        run: dotnet run --project samples/GstDeviceMonitor --no-restore

      # Same two runs as the Linux leg; see the comments there.
      - name: GstInspect
        run: |
          dotnet run --project samples/GstInspect --no-restore
          dotnet run --project samples/GstInspect --no-restore -- fakesink

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-macos
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Windows, MinGW flavor. MSYS2 is how the maintainer's machine is set up and
  # the only way to get the "lib" prefixed Windows file names under test. The
  # installation is deliberately not announced through an environment variable:
  # putting mingw64\bin on PATH is exactly what the MSYS2 branch of
  # NativeInstallPlanner has to recognize.
  # --------------------------------------------------------------------------
  windows-mingw:
    name: windows (MinGW from MSYS2)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install MSYS2 with GStreamer
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          path-type: minimal
          # The -libs half of the bad plugins carries libgstwebrtc-1.0-0.dll and
          # little else; the plugins themselves are not under test and would
          # pull in fifty more packages. The editing services have no such
          # split: one package carries libges-1.0-0.dll together with the nle
          # and ges plugins, and the GES tests need both halves. The RTSP
          # server is a package of its own as well, and it carries the
          # libgstrtspserver-1.0-0.dll the GstRtspServer module imports from.
          install: >-
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad-libs
            mingw-w64-x86_64-gst-rtsp-server
            mingw-w64-x86_64-gst-editing-services

      # The planner walks PATH, recognizes the msys64 root inside the entry and
      # probes ucrt64\bin, mingw64\bin and clang64\bin below it. Prepending the
      # directory also lets the plugins find their own dependencies.
      - name: Put the MinGW installation on PATH
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin'
          if (-not (Test-Path (Join-Path $bin 'libgstreamer-1.0-0.dll'))) {
            throw "No MinGW GStreamer below $bin."
          }
          Write-Host "MinGW GStreamer: $bin"
          & (Join-Path $bin 'gst-inspect-1.0.exe') --version
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      - name: Test the runtime
        run: dotnet test tests/GstSharp.Core.Tests --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      - name: Test against the installation
        run: dotnet test tests/GstSharp.IntegrationTests --no-restore --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      # Also the diagnostic of this job: the sample prints which flavor and
      # which directory the loader pinned, so a detection change shows up in
      # the log even while the tests still pass.
      - name: AppSinkSpans
        run: dotnet run --project samples/AppSinkSpans --no-restore -- --mode pull

      # The RTP module on the same route: a payloader feeding an appsink, every
      # header read through a mapped RTPBuffer, and a compound RTCP packet
      # built and read back.
      - name: RtpPacketDump
        run: dotnet run --project samples/RtpPacketDump --no-restore

      # The Windows half of the gst-launch port: this is the only leg where the
      # multimedia timer is raised, and the sample says which precision it got
      # on its first line.
      - name: GstLaunch
        run: dotnet run --project samples/GstLaunch --no-restore -- videotestsrc num-buffers=100 ! fakesink

      # Same port as the Linux leg; see the comments there. The relative
      # location= path keeps the two lines identical across bash and pwsh, and
      # dotnet run leaves the working directory at the repository root on both.
      - name: GstTypefind
        run: |
          dotnet run --project samples/GstLaunch --no-restore -- -q audiotestsrc num-buffers=50 ! wavenc ! filesink location=typefind-sample.wav
          dotnet run --project samples/GstTypefind --no-restore -- --fail-on-unknown typefind-sample.wav

      # Same port as the Linux leg; see the comments there. This is also where
      # libgstplay-1.0-0.dll, the "lib" prefixed MinGW file name of the module,
      # is loaded outside the test suite.
      - name: GstPlay
        run: |
          dotnet run --project samples/GstPlay --no-restore -- --duration 2 --videosink fakesink --audiosink fakesink typefind-sample.wav
          dotnet run --project samples/GstPlay --no-restore -- --list-visualizations

      # Same run as the Linux leg; see the comments there.
      - name: PlaybinPlayer
        run: dotnet run --project samples/PlaybinPlayer --no-restore -- --timeout 30

      # Same run as the Linux leg; see the comments there.
      - name: RtspServer
        run: dotnet run --project samples/RtspServer --no-restore -- --port 0 --timeout 5

      # Same two runs as the Linux leg; see the comments there.
      - name: GstInspect
        run: |
          dotnet run --project samples/GstInspect --no-restore
          dotnet run --project samples/GstInspect --no-restore -- fakesink

      # No GstDeviceMonitor on this leg: no device provider comes up on it.
      # The practical Windows providers, wasapi2 among them, live in the bad
      # plugins, which this job deliberately installs as libraries only, and
      # the directsound provider of gst-plugins-good does not register in a
      # headless session - the first run proved it by failing to start.

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-mingw
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Windows, MSVC flavor: the official installer plus the two NativeAOT gates.
  # --------------------------------------------------------------------------
  windows-msvc-aot:
    name: windows (MSVC installer, NativeAOT)
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      GSTREAMER_VERSION: '1.28.6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      # The installer does not change for a pinned version, so downloading it
      # once per week of cache lifetime is enough.
      - name: Cache the GStreamer installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\gstreamer-download
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - name: Install GStreamer (MSVC)
        shell: pwsh
        run: >
          ./eng/install-gstreamer-windows.ps1
          -Version $env:GSTREAMER_VERSION
          -Flavor msvc
          -DownloadDirectory "$env:RUNNER_TEMP\gstreamer-download"

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      # Gate 1: nothing the runtime does may produce a trimming or an AOT
      # warning, and the published executable has to reach the native library.
      - name: NativeAOT smoke
        shell: pwsh
        run: ./eng/aot-gate.ps1 -Project samples/AotSmoke -Rid win-x64

      # Gate 2: ParseLaunch plus GetByName-as-AppSink under
      # full trimming. A missing GType registration fails as a null cast at run
      # time and not as a build warning, so the gate is the exit code of the
      # published executable.
      - name: NativeAOT type registry
        shell: pwsh
        run: >
          ./eng/aot-gate.ps1
          -Project samples/AppSinkSpans
          -Rid win-x64
          -Property InvariantGlobalization=true
          -RunArguments '--mode','pull'

      - name: Upload publish logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-logs-windows-msvc
          path: artifacts/logs
          if-no-files-found: ignore
          retention-days: 7
