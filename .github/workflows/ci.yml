# Push and pull request gates.
#
# The jobs are split by what they need from the machine:
#
#   verify            no native GStreamer at all: generator drift, a
#                     warning-free build, every test suite that runs against
#                     fakes rather than against the library, and the pack that
#                     validates the surface against the published baseline.
#   linux             the Linux SONAME path of the native loader, the only
#                     plugin set complete enough to run the WebRTC tests, and
#                     the NativeAOT gate, on two legs of one matrix: linux-x64
#                     on ubuntu-24.04 and linux-arm64 on ubuntu-24.04-arm. The
#                     arm64 leg is the only Linux arm64 coverage there is.
#   macos             the macOS dylib path of the native loader and the
#                     osx-arm64 NativeAOT gate.
#   windows-mingw     the MinGW flavor, found the way a developer with MSYS2
#                     finds it: from the process search path, with no
#                     environment variable to help it.
#   windows-msvc-aot  the MSVC flavor plus the two win-x64 NativeAOT gates.
#
# eng/ci-notes.md explains every installation strategy, the pinned versions and
# how to run the same gate on a development machine.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Called by release.yml, so that a tag runs the same gates as a branch.
  workflow_call:
  workflow_dispatch:

# Only the newest commit of a branch or pull request has to be green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # --------------------------------------------------------------------------
  # Everything that holds without a GStreamer installation.
  # --------------------------------------------------------------------------
  verify:
    name: verify (no native)
    runs-on: ubuntu-latest
    # 20 rather than 15 since the surface check at the end of the job joined
    # it: packing in Release compiles the whole solution a second time, which
    # the rest of the leg does not.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner images already ship a 10.0.4xx SDK, which global.json
      # (10.0.100, rollForward latestFeature) accepts, so there is no
      # setup-dotnet step here: it downloaded 300 MB on every job to install
      # the day's newest patch, 25 to 30 seconds on Windows and 8 to 11
      # elsewhere. The trade-off, accepted deliberately: the SDK patch level
      # this workflow builds with now follows the runner image rather than
      # being the newest one that exists. The action also registered the dotnet
      # problem matcher, so the build errors and warnings of this workflow no
      # longer turn into inline annotations and are read from the log.
      #
      # dotnet --version resolves through global.json, so it is also the
      # gate. If an image stops shipping 10.0, or global.json asks for a band
      # the images do not have, this step turns red first and with the SDK
      # resolver's own message, instead of something confusing in Restore -
      # and the fix is to put setup-dotnet with global-json-file back.
      #
      # release.yml, publish-nuget.yml and docs.yml still install an SDK with
      # setup-dotnet.
      - name: Show the SDK
        run: dotnet --version

      # No NuGet cache on this job: a cold restore here takes 9 seconds, which
      # is no better than a warm restore plus the cache download. Only the two
      # Windows legs keep one; eng/ci-notes.md has the measurements.
      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      # The generated sources are committed, so the gate is that regenerating
      # them changes nothing: 408 files plus girs/skip-report.md, which the
      # generator writes next to the gir files it was derived from.
      - name: Generator drift
        run: dotnet run --project generator/GstSharp.Generator --no-restore -- verify --gir-dir girs --out-dir src

      # TreatWarningsAsErrors is already on in Directory.Build.props. The
      # -warnaserror switch additionally promotes MSBuild and NuGet warnings,
      # which this repository also keeps at zero.
      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore -warnaserror

      - name: Test the generator
        run: dotnet test tests/GstSharp.Generator.Tests --no-build --logger "trx;LogFileName=generator.trx" --results-directory artifacts/test-results

      - name: Test the analyzers
        run: dotnet test tests/GstSharp.Analyzers.Tests --no-build --logger "trx;LogFileName=analyzers.trx" --results-directory artifacts/test-results

      # GstSharp.Core.Tests is native free by construction: the loader rules run
      # against FakePlatformProbe and the marshalling tests stop before the
      # first call into GLib. Running them on a machine without GStreamer is
      # what keeps that true.
      - name: Test the runtime (proves it needs no GStreamer)
        run: dotnet test tests/GstSharp.Core.Tests --no-build --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      # The compatibility gate, and the reason it runs here rather than at
      # release time only: EnablePackageValidation is a pack-time check
      # (src/Directory.Build.props), so without this step a removed member
      # would sit on main until a tag went out and then fail the publish, with
      # the surface already promised. Every push proves instead that every
      # package with a published baseline still contains everything that
      # baseline shipped. A module added since the baseline turns package
      # validation off in its own project until its first release is on
      # nuget.org; eng/ci-notes.md says why.
      #
      # The version is a marker, not a release: 1.28.999-surface-check sorts
      # above anything the series will ever tag, so a stray package from this
      # step cannot be mistaken for one, and nothing is pushed anywhere - the
      # packages are written into artifacts/ and thrown away with the runner.
      # The invocation is otherwise the release job's, minus the arguments that
      # only the GitHub Packages feed needs.
      - name: Pack against the published surface
        run: >
          dotnet pack GstSharp.Net.slnx
          --no-restore
          --configuration Release
          --output artifacts/surface-check
          -p:Version=1.28.999-surface-check

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-verify
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Linux: the loader resolves libgstreamer-1.0.so.0 by SONAME through the
  # dynamic linker, which no other job exercises. The runner is pinned to
  # 24.04 because its GStreamer 1.24 is the floor the ABI probes assert
  # against; ubuntu-latest would silently lift that floor.
  #
  # It runs twice, as a two-entry matrix rather than as two jobs, so that the
  # two architectures are held to byte-identical steps: the matrix substitutes
  # the runner label, the NativeAOT RID and the artifact name, and nothing
  # else. The arm64 leg is the only Linux arm64 coverage the workflow has —
  # macos is arm64 as well, but what it exercises there is the dylib naming and
  # the Homebrew directory of the planner, not the SONAME path — so it is what
  # puts the ABI probes, which assert struct sizes and raw field offsets
  # against the installed library, on arm64 under the Linux ABI and against
  # the distribution's build of the library, which the macOS run of the same
  # probes does not stand in for. ubuntu-24.04-arm is pinned for the same
  # reason ubuntu-24.04 is: Ubuntu Ports ships the same GStreamer 1.24.2 on
  # arm64, so the floor is the same floor, and a moving label would lift it
  # just as silently here.
  #
  # fail-fast is off on purpose: when one architecture breaks, the log of the
  # other is what says whether the break is architectural, and a leg cancelled
  # by its sibling says nothing at all.
  # --------------------------------------------------------------------------
  linux:
    name: linux ${{ matrix.arch }} (GStreamer from apt)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # 30 rather than 20 since the NativeAOT publish at the end of the job
    # joined it: ILC compiles and links a native binary, which the rest of the
    # leg does not.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-dotnet: the image's own SDK, resolved through global.json.
      # See the verify job.
      - name: Show the SDK
        run: dotnet --version

      # Runtime packages only: the binding loads versioned SONAMEs
      # (libgstreamer-1.0.so.0, libgstapp-1.0.so.0), which the runtime packages
      # provide. The -dev packages would only add headers and the unversioned
      # symlinks, neither of which is used. libgstwebrtc-1.0.so.0 is what the
      # bad libraries package is here for: the GstWebRTC binding registers its
      # types from a module initialiser, so the library has to be resolvable
      # whatever else is installed. libges-1.0-0 is the same story twice: it
      # carries libges-1.0.so.0 for the registry freeze, and the nle and ges
      # plugins beside it, which ges_init needs before a timeline can be built
      # at all.
      #
      # This is also the one leg that takes the bad *plugins* and not only their
      # libraries, and it takes them for a single element: webrtcbin. Everywhere
      # else the plugins are left out because they cost fifty packages and buy
      # the binding nothing, with the result that every WebRTC test was skipped
      # on every leg — a guard that never runs guards nothing. gstreamer1.0-nice
      # is the other half of that element: webrtcbin is findable without it but
      # cannot leave the NULL state, because it builds its transports out of
      # nicesrc and nicesink. gstreamer1.0-alsa is here for one element for the
      # same reason: alsasink is the audio sink the AudioBaseSink tests build
      # theirs out of, Ubuntu ships neither it nor pulsesink in the base plugin
      # package, and without it all four of those tests skipped here too.
      # libgstrtspserver-1.0-0 is the library of the RTSP server, which apt
      # ships apart from the core packages: the module registration test loads
      # it on this leg and has no skip path. gstreamer1.0-x is here for one
      # element as well: textoverlay, which lives in libgstpango and which apt
      # puts in that package rather than in the base plugins, so without it
      # subtitleoverlay posts a missing-plugin warning and goes passthrough,
      # and playback tutorial 2 would select a subtitle stream that nothing
      # renders.
      # What this leg now promises is asserted rather than
      # assumed; see the integration test step below.
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-0 \
            libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-bad1.0-0 \
            libges-1.0-0 \
            libgstrtspserver-1.0-0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-nice \
            gstreamer1.0-alsa \
            gstreamer1.0-x \
            gstreamer1.0-tools
          gst-inspect-1.0 --version

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      # Everything below this point runs what the Build step above produced,
      # in the same Debug configuration, so --no-build is what every test and
      # sample invocation of the job carries. --no-restore alone was not
      # enough: it still re-enters the incremental build, which costs two to
      # four seconds per invocation, and a leg runs about fifty of them.
      # --no-build implies --no-restore.
      #
      # The price is that a sample or test project outside GstSharp.Net.slnx
      # fails here with a missing assembly instead of being built silently by
      # its first run - which is the behaviour to keep: the solution is what
      # the Build step, and therefore every gate, is defined over.
      - name: Test the runtime
        run: dotnet test tests/GstSharp.Core.Tests --no-build --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      # GSTSHARP_REQUIRED_ELEMENTS is the promise this leg makes about its
      # installation, and RequiredElementsTests is what holds it to it: the
      # factories listed here are the ones the tests gate on with RequiresElementFact
      # that only a plugin set this leg installs on purpose provides — three for WebRTC,
      # audiomixer for the only boxed valued property the integration suite
      # writes and for the one fraction valued property beside it,
      # theoraenc and vorbisenc for the two encoders whose set_headers
      # hands a list over, theoradec for the decoder the VideoCodecFrame
      # user data tests borrow a frame from, uritranscodebin with
      # transcodebin for the transcode plugin the GstTranscoder tests build
      # their transcoder out of, and oggmux for the muxer that PbutilsTests
      # needs beside vorbisenc before a serialised encoding profile parses
      # into a container at all, and rtpL16pay for the payloader the GstRtp
      # tests read as an RTPBasePayload, and alsasink for the audio sink the
      # AudioBaseSink tests build theirs out of, which they only ever
      # construct — the device is opened by the ring buffer on the way out of
      # NULL and those tests never take the sink there — so the day
      # gstreamer1.0-plugins-bad, gstreamer1.0-nice, gstreamer1.0-alsa,
      # gstreamer1.0-plugins-good or gstreamer1.0-plugins-base stops
      # providing one of them this step turns
      # red instead of quietly downgrading those tests to skips. The variable
      # is scoped to this step because it is a statement about the suite that
      # reads it, and it is set on this leg alone because this is the only leg
      # that installs the plugins.
      #
      # gesdemux is here for a step, not for a test: it is what the GesLaunch
      # step that loads a nested project below plays the .xges through, and it
      # comes from the ges plugin of libges-1.0-0. Listing it here makes a leg
      # that lost that plugin red on this step, which names the missing
      # factory, instead of red further down on a load that cannot say why.
      #
      # videobalance and playbin are the two elements the ColorBalanceChannel
      # field tests read a real channel off: videobalance comes from the
      # videofilter plugin of gstreamer1.0-plugins-good and builds the four
      # channels the plugin names, playbin comes from the playback plugin of
      # gstreamer1.0-plugins-base and lists the four proxy channels of its
      # sink. Both are installed here on purpose, so a leg that lost either
      # turns this step red rather than skipping the tests that prove the
      # hand bound fields against a live instance.
      #
      # opusenc, opusdec, rtpopuspay and rtpopusdepay are here for a step as
      # well: they are the codec and the payloaders the WebRtcLoopback step
      # below builds its call out of, and they come from the opus plugin of
      # gstreamer1.0-plugins-base and the rtp plugin of
      # gstreamer1.0-plugins-good. The sample names a missing element itself,
      # but naming them here turns a leg that lost one of them red on this
      # step, beside webrtcbin and nicesrc, rather than at the end of the job.
      #
      # rtphdrextclientaudiolevel is the RFC 6464 header extension the
      # RtpHeaderExtensionSurface tests add to a payloader and a depayloader.
      # It comes from the rtpmanager plugin of gstreamer1.0-plugins-good,
      # which is the plugin rtpbin is in, so this leg has it wherever the
      # already listed rtspsrc and webrtcbin can build their sessions at all.
      # Listing it keeps those two tests from degrading into skips on the one
      # leg that is supposed to run them.
      #
      # --blame-hang names the test that stopped making progress: without it a
      # hung leg is killed by timeout-minutes, and the upload steps are gated
      # on `if: ${{ failure() }}`, which a cancellation by the job cap does not
      # satisfy - an always() step would still run, a failure() one does not -
      # so the run ends with a red job and no culprit. The per-test budget is
      # five minutes on every leg. The integration step finishes in well under
      # a minute on all four of them - around twenty seconds on the last green
      # run, 22 s on linux x64 and 20 s on linux arm64 - so five minutes per
      # test is a hang rather than a slow test, and
      # it still leaves the thirty minute job cap room for the dump to be
      # written and uploaded. The dump is a mini one: the sequence file already
      # names the test, a mini dump keeps every thread stack, which is what a
      # hang is read from, and a full dump of a process with GStreamer loaded
      # is large enough to slow the upload down for nothing. The sequence file
      # and the dump land in --results-directory, which is the directory the
      # upload step already takes.
      - name: Test against the installation
        env:
          GSTSHARP_REQUIRED_ELEMENTS: webrtcbin,nicesrc,dtlssrtpenc,audiomixer,theoraenc,theoradec,vorbisenc,uritranscodebin,transcodebin,oggmux,rtpL16pay,rtpL16depay,rtspsrc,alsasink,volume,videoconvert,rawaudioparse,vorbisdec,audioconvert,gesdemux,opusenc,opusdec,rtpopuspay,rtpopusdepay,videobalance,playbin,rtphdrextclientaudiolevel
        run: dotnet test tests/GstSharp.IntegrationTests --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      # The whole consumer path without AOT: parse a pipeline, cast the sink
      # through the GType registry, read every frame through a span.
      - name: AppSinkSpans
        run: dotnet run --project samples/AppSinkSpans --no-build -- --mode pull

      # The RTP module on the same route: a payloader feeding an appsink, every
      # header read through a mapped RTPBuffer, and a compound RTCP packet
      # built and read back.
      - name: RtpPacketDump
        run: dotnet run --project samples/RtpPacketDump --no-build

      # A metadata implementation of the application's own, carried across a
      # real conversion: the sample registers its API type with no tags,
      # attaches one item per frame it pushes into an appsrc, and reads the
      # payload back off the buffers videoconvert allocated. It is an exit code
      # gate — a frame that arrives without its item, or with the wrong
      # sequence number in it, exits 1. appsrc, appsink and videoconvert all
      # come from the base and app plugins this job already installs.
      - name: CustomMeta
        run: dotnet run --project samples/CustomMeta --no-build

      # The gst-launch port, run headless three ways: the plain end of stream,
      # the buffering state machine, and the interrupt, which travels through a
      # GstLaunchInterrupt application message and out again as an injected EOS.
      # This is the leg that proves the POSIX side of the sample — the SIGHUP
      # and SIGQUIT registrations are installed on every run here. Each line is
      # an exit code gate; videotestsrc, queue2 and fakesink come from the core
      # and base plugins this job already installs.
      - name: GstLaunch
        run: |
          dotnet run --project samples/GstLaunch --no-build -- videotestsrc num-buffers=100 ! fakesink
          dotnet run --project samples/GstLaunch --no-build -- --no-position videotestsrc num-buffers=60 ! queue2 use-buffering=true max-size-buffers=0 max-size-bytes=0 max-size-time=1000000000 ! fakesink sync=true
          dotnet run --project samples/GstLaunch --no-build -- -m -e --interrupt-after 1 videotestsrc ! fakesink

      # The gst-typefind port. The media is made here rather than fetched: the
      # first line writes a wav with the GstLaunch sample, the second identifies
      # it. --fail-on-unknown is what turns this into a gate — the C tool exits
      # 0 even for a file it could not identify, so without it the step would
      # only prove that nothing crashed. The detected type is on the log line.
      - name: GstTypefind
        run: |
          dotnet run --project samples/GstLaunch --no-build -- -q audiotestsrc num-buffers=50 ! wavenc ! filesink location=typefind-sample.wav
          dotnet run --project samples/GstTypefind --no-build -- --fail-on-unknown typefind-sample.wav

      # The gst-stats port. The log it reads is made here rather than committed:
      # the first step runs a short pipeline with the tracers on and points the
      # debug log at a file, the second reads that file back. They are two steps
      # rather than two lines of one because GST_TRACERS and GST_DEBUG_FILE are
      # read once, inside gst_init, and the file is truncated when it is opened
      # -- g_fopen(name, "w") in _priv_gst_debug_init, CREATE_ALWAYS on Windows
      # -- so an analyzer that inherited the two would trace itself over its own
      # input. The latency tracer traces the pipeline alone unless the flags
      # parameter says otherwise, which is what puts element-latency and
      # element-reported-latency records in the log as well. --fail-if-empty is
      # what turns the second step into a gate: the C tool exits 0 for a log it
      # found nothing in, so without it the step would only prove that nothing
      # crashed.
      - name: GstStats trace
        env:
          GST_TRACERS: stats;rusage;latency(flags=pipeline+element+reported);factories
          GST_DEBUG: GST_TRACER:7
          GST_DEBUG_FILE: gst-stats-trace.log
          GST_DEBUG_NO_COLOR: "1"
        run: dotnet run --project samples/GstLaunch --no-build -- -q videotestsrc num-buffers=50 ! videoconvert ! fakesink

      - name: GstStats
        run: dotnet run --project samples/GstStats --no-build -- --fail-if-empty gst-stats-trace.log

      # The gate the sample exists for: the report it prints has to be the
      # report the real tool prints. Both read the same log, so nothing is
      # normalised away except the line ending. What is compared is the sorted
      # lines rather than the file: the C tool walks a GHashTable to print its
      # thread sections and its latency tables, so with the rusage tracer on and
      # more than one thread in the log the order of whole sections is
      # undefined, where the port prints them ordered by thread id and by key.
      # Every line still has to be there exactly once. This job alone runs it,
      # on both of its legs, because gst-stats-1.0 comes from
      # gstreamer1.0-tools, which is also where the gst-inspect-1.0 of the step
      # above comes from.
      - name: GstStats against gst-stats-1.0
        run: |
          set -euo pipefail
          unset GST_DEBUG
          export LC_ALL=C
          gst-stats-1.0 gst-stats-trace.log | tr -d '\r' > gst-stats-expected.txt
          dotnet run --project samples/GstStats --no-build -- gst-stats-trace.log | tr -d '\r' > gst-stats-actual.txt
          echo "--- gst-stats-1.0"
          cat gst-stats-expected.txt
          echo "--- samples/GstStats"
          cat gst-stats-actual.txt
          if ! diff -u <(sort gst-stats-expected.txt) <(sort gst-stats-actual.txt); then
            echo "::error::gst-stats-1.0 and samples/GstStats disagree"
            exit 1
          fi

      # The appsrc port of the same idea, from the other end: the application is
      # the source and pushes only while appsrc asks it to. --output turns the
      # run into a byte count gate as well — what the file weighs has to be what
      # was pushed — and filesink and audioconvert are core and base elements
      # this job already has.
      - name: AppSrcPush
        run: dotnet run --project samples/AppSrcPush --no-build -- --buffers 200 --output appsrc-push.raw

      # The ported GStreamer tutorials. All eighteen are built by the solution
      # on every leg; these sixteen are the ones that can also run, and they run
      # on both Linux legs rather than anywhere else because those have the
      # richest plugin set and no GUI to tempt them.
      #
      # --headless is the sample-only option that swaps every automatic sink
      # for a fakesink and bounds a source that has no end of its own: an audio
      # sink in a session with no sound daemon does not fail, it waits, which
      # is the lesson the device monitor step below records. Each line is an
      # exit code gate.
      #
      # The media is made here rather than fetched. Ten seconds of Theora and
      # Vorbis in an Ogg container is a real file with two streams, which is
      # what basic tutorial 3 needs to have a pad to ignore, basic 4 and 13 need
      # to have something to seek in, and basic 9 needs to have a topology to
      # walk. theoraenc, vorbisenc and oggmux are all in gst-plugins-base, which
      # this job installs. Playback 3 takes no fixture: it generates what it
      # plays and pushes it into the appsrc that playbin builds for appsrc://.
      #
      # Basic tutorial 9 takes no --headless: it builds no sink at all, only a
      # discoverer, and its gate is its own exit code — a URI that was not
      # understood is a failure there rather than a printed line. Playback 8
      # reads a missing factory the same way: --enable of a name the registry
      # does not have exits 1 instead of returning silently as the C snippet
      # does.
      #
      # Not run: basic tutorial 1, whose default media is an https URI, and
      # basic tutorial 6, whose interesting output is the caps a real audio
      # sink negotiates. Those two are the only ones of the eighteen that are
      # built and not run; playback 9 is not ported at all.
      #
      # Playback 5 moves the colour balance of the picture. --keys covers all
      # eight channel keys in nine presses and then quits, one key every half
      # second, so the tenth and last of them — the q — lands five seconds into
      # a ten second fixture. The port turns each press into a gate: the value
      # the channel is expected to take is compared with what playbin reports
      # afterwards, so a run that moved nothing exits 1, as does a key that
      # matched no channel of the element, a character that is none of the
      # tutorial's keys at all, and an EOS reached with keys still unfed. It
      # needs no plugin beyond playbin itself — playsink answers from its own
      # proxy channels whatever sink is in place.
      #
      # Playback 7 puts an equalizer-3bands in front of its audio sink. That
      # element is in gst-plugins-good, which the install step of this job
      # takes, so both legs of the matrix have it.
      #
      # Eighteen tutorials are built on every leg; sixteen are run here, on
      # both Linux legs. Three extra fixtures are made alongside the one above:
      # tutorial-multitrack.ogg carries two Vorbis streams so that playback 1
      # and 2 have something to choose between, tutorial-audio.ogg carries no
      # video at all so that playback 6's visualization chain is really built
      # (playsink only draws one when there is no video stream), and
      # tutorial-subs.srt is a four-cue subtitle file for playback 2. Four and
      # not two because gst_sub_parse_type_find (gst-plugins-base
      # gst/subparse/gstsubparseelement.c:290 at tag 1.24.2) peeks exactly 128
      # bytes and gives up when the file is shorter, and 1.24 is what apt
      # installs here: a smaller .srt is not recognised at all, playbin turns
      # the suburi failure into a warning, and the tutorial plays with no text.
      # Do not shrink it.
      #
      # The two buffering tutorials are pointed at a local http server rather
      # than at a file: a file:// URI never buffers and never downloads, so the
      # BUFFERING path of basic 12 and the temp-location path of playback 4
      # would both go untested. souphttpsrc comes with
      # gstreamer1.0-plugins-good, whose hard dependency on libsoup-3.0-0 the
      # --no-install-recommends install above therefore already pulls in.
      #
      # The server is eng/ci/range-http-server.py and not python3 -m
      # http.server, because the stock one ignores Range and always answers 200
      # with the whole body. souphttpsrc advertises itself as seekable, oggdemux
      # seeks to the end to read the duration, and against a server with no
      # ranges that seek fails: the run errors out with "Server does not support
      # seeking" at exactly 100% buffering. The readiness wait is therefore a
      # Range probe that insists on a 206 — it proves both that the server is up
      # and that it does what the two tutorials need. The server is trapped so
      # that it is killed even when a gate fails.
      - name: Tutorials
        run: |
          dotnet run --project samples/GstLaunch --no-build -- -q videotestsrc num-buffers=300 ! video/x-raw,width=320,height=240,framerate=30/1 ! videoconvert ! theoraenc ! oggmux name=mux ! filesink location=tutorial-media.ogg audiotestsrc num-buffers=430 ! audioconvert ! vorbisenc ! mux.
          dotnet run --project samples/GstLaunch --no-build -- -q videotestsrc num-buffers=300 ! video/x-raw,width=320,height=240,framerate=30/1 ! videoconvert ! theoraenc ! oggmux name=mux ! filesink location=tutorial-multitrack.ogg audiotestsrc num-buffers=430 freq=440 wave=sine ! audioconvert ! vorbisenc ! mux. audiotestsrc num-buffers=430 freq=880 wave=square ! audioconvert ! vorbisenc ! mux.
          dotnet run --project samples/GstLaunch --no-build -- -q audiotestsrc num-buffers=430 ! audioconvert ! vorbisenc ! oggmux ! filesink location=tutorial-audio.ogg
          printf '1\n00:00:00,500 --> 00:00:02,000\nFirst subtitle cue, long enough to typefind\n\n2\n00:00:02,500 --> 00:00:04,000\nSecond subtitle cue, long enough to typefind\n\n3\n00:00:04,500 --> 00:00:06,000\nThird subtitle cue, long enough to typefind\n\n4\n00:00:06,500 --> 00:00:09,000\nFourth subtitle cue, long enough to typefind\n\n' > tutorial-subs.srt
          python3 eng/ci/range-http-server.py 8765 --bind 127.0.0.1 &
          server=$!
          trap 'kill $server' EXIT
          for i in $(seq 1 30); do [ "$(curl -sf -r 0-0 -o /dev/null http://127.0.0.1:8765/tutorial-media.ogg -w '%{http_code}')" = "206" ] && break; sleep 1; done
          test "$(curl -sf -r 0-0 -o /dev/null http://127.0.0.1:8765/tutorial-media.ogg -w '%{http_code}')" = "206"
          dotnet run --project samples/tutorials/BasicTutorial02 --no-build -- --headless
          dotnet run --project samples/tutorials/BasicTutorial03 --no-build -- --headless tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial04 --no-build -- --headless --seek-at 1 --seek-to 7 tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial07 --no-build -- --headless --buffers 200
          dotnet run --project samples/tutorials/BasicTutorial08 --no-build -- --headless --chunks 200
          dotnet run --project samples/tutorials/BasicTutorial09 --no-build -- tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial12 --no-build -- --headless http://127.0.0.1:8765/tutorial-media.ogg
          dotnet run --project samples/tutorials/BasicTutorial13 --no-build -- --headless --keys SsPNNPDq tutorial-media.ogg
          dotnet run --project samples/tutorials/PlaybackTutorial01 --no-build -- --headless --keys 1 tutorial-multitrack.ogg
          dotnet run --project samples/tutorials/PlaybackTutorial02 --no-build -- --headless --keys 0 tutorial-multitrack.ogg tutorial-subs.srt
          dotnet run --project samples/tutorials/PlaybackTutorial03 --no-build -- --headless --chunks 200
          dotnet run --project samples/tutorials/PlaybackTutorial04 --no-build -- --headless http://127.0.0.1:8765/tutorial-media.ogg
          dotnet run --project samples/tutorials/PlaybackTutorial05 --no-build -- --headless --keys CCcBbHhSsq tutorial-media.ogg
          dotnet run --project samples/tutorials/PlaybackTutorial06 --no-build -- --headless tutorial-audio.ogg
          dotnet run --project samples/tutorials/PlaybackTutorial07 --no-build -- --headless tutorial-media.ogg
          dotnet run --project samples/tutorials/PlaybackTutorial08 --no-build -- --headless --enable theoradec tutorial-media.ogg

      # The gst-discoverer port, run against both files the steps above made:
      # the wav for a single elementary stream and the ogg for a container with
      # a video and an audio stream under it, which is what exercises the
      # topology walk. --fail-on-error is the gate — the C tool exits 0 for a
      # URI it could not discover — and --verbose --toc puts the tag and table
      # of contents paths on the log line as well.
      #
      # This is the leg that has the plugins for it: wavparse comes from
      # gst-plugins-good, oggdemux, theoradec, vorbisdec and uridecodebin from
      # gst-plugins-base, and typefind from core.
      - name: GstDiscoverer
        run: |
          dotnet run --project samples/GstDiscoverer --no-build -- --fail-on-error typefind-sample.wav
          dotnet run --project samples/GstDiscoverer --no-build -- --fail-on-error --verbose --toc tutorial-media.ogg

      # The transcoder port, on the only leg provisioned for it: uritranscodebin
      # and transcodebin come from the transcode plugin of gst-plugins-bad,
      # which this job installs and lists in GSTSHARP_REQUIRED_ELEMENTS, and
      # macOS and Windows have no such guarantee.
      #
      # The input is the wav the typefind step made rather than the ogg: the
      # default profile is application/ogg:audio/x-vorbis, audio only, so an
      # audio only source is what it can be asked to reproduce. Both arguments
      # are URIs, which is the sample's contract. The file the run wrote is the
      # gate on top of the exit code — a transcoder that reported success and
      # produced nothing would otherwise pass.
      - name: GstTranscode
        run: |
          dotnet run --project samples/GstTranscode --no-build -- "file://$PWD/typefind-sample.wav" "file://$PWD/transcoded.ogg"
          test -s transcoded.ogg

      # The gst-play port, backed by the Play object of GstSharp.Net.Play rather
      # than by a playbin of its own. It runs against the ogg the tutorial step
      # made, which is the file with both an audio and a video stream in it, so
      # that both sinks and the media info summary have something to report.
      # --duration bounds the run and the two fakesinks keep it headless, which
      # is what makes the line an exit code gate; the second line proves the
      # hand-written visualization enumeration on an installation that has the
      # bad plugins. playbin3 comes from gst-plugins-base, which this job
      # installs. The third run is the ported half of the C tool's options: the
      # playlist file is written here, one comment line and one media file, and
      # --flags asks the playbin for video, audio and the soft volume, which is
      # the set that keeps playsink from logging a missing volume control with
      # the fakesinks. The sample reads the flags property back and fails the
      # run when what landed differs, so the line gates the by-name write.
      - name: GstPlay
        run: |
          dotnet run --project samples/GstPlay --no-build -- --duration 2 --videosink fakesink --audiosink fakesink tutorial-media.ogg
          dotnet run --project samples/GstPlay --no-build -- --list-visualizations
          printf '# the sample skips this line and every blank one\n%s\n' tutorial-media.ogg > play-list.txt
          dotnet run --project samples/GstPlay --no-build -- --duration 2 --videosink fakesink --audiosink fakesink --flags video+audio+soft-volume --playlist play-list.txt

      # The plain application sample: a pipeline built from a description and
      # driven from a polled bus, with no main loop and no signal handler
      # anywhere in it. It is run without a URI, which is the mode that has an
      # exit code to gate — the built in description ends after 300 buffers of
      # videotestsrc into a fakesink, so the step passes only when the bus
      # reported end of stream, and --timeout bounds the wait either way.
      #
      # It is not run against tutorial-media.ogg, although the file exists at
      # this point of the job. The sample hands its argument to playbin
      # verbatim, so the media would have to be spelled as a file:// URI in
      # three different shells, and it offers no sink override: playbin would
      # build an autovideosink and an autoaudiosink, and a hosted runner has
      # neither a display nor a sound card to give them.
      - name: PlaybinPlayer
        run: dotnet run --project samples/PlaybinPlayer --no-build -- --timeout 30

      # The test-launch port: an RTSP server that mounts one factory, serves it
      # and stops itself again in the order docs/ownership.md prescribes. No
      # client is attached, so what the step gates is the server half, which is
      # the part this binding owns by hand: the mounted factory survives the
      # mount with its handler on it, Attach answers a source, Detach takes it
      # off the sample's own context again and the wait for the clients to
      # finish closing ends. Nothing of the launch line is instantiated without
      # a client, so no plugin beyond the RTSP server library itself is needed
      # here; a real client playing a real mount is what the integration tests
      # do. --timeout 5 is what ends the step, since the sample serves until
      # Ctrl-C otherwise, and --port 0 lets the operating system pick the
      # port so the step never collides with whatever else the runner has
      # bound.
      - name: RtspServer
        run: dotnet run --project samples/RtspServer --no-build -- --port 0 --timeout 5

      # Loopback mode: the client hosts the RtspServer sample's mount itself.
      - name: RtspClient
        run: dotnet run --project samples/RtspClient --no-build -- --buffers 100 --timeout 60

      # The editing services with a managed clip and a managed source in the
      # timeline: what this gates is the child contract, since the clip is only
      # given a child if its create_track_element answered one the library could
      # extract from an asset. It needs the nle and ges plugins and the base
      # and good plugin sets a video source bin is built from, and --timeout 20
      # is the deadline the half second clip has to reach the end of stream in.
      - name: GesCustomSource
        run: dotnet run --project samples/GesCustomSource --no-build -- --timeout 20

      # ges-launch-1.0 on the binding. This first run is the whole load path:
      # the "ges:" description is parsed by the library's own formatter, the
      # clips are synthetic so no media file is needed, and the "loaded" signal
      # only ever arrives because the sample iterates the default main context
      # itself - a sample that forgot to would hang here until the timeout.
      - name: GesLaunch (playback)
        run: dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 +test-clip snow d=1.0 +test-clip smpte d=1.0

      # The informative path, which needs no pipeline at all: the transition
      # nicks are read out of the type system, so this is what proves the
      # enumeration is registered by the time the sample asks for it.
      - name: GesLaunch (list transitions)
        run: dotnet run --project samples/GesLaunch --no-build -- --no-interactive --timeout 30 --list-transitions

      # Save a project and load it again. Saving is the first GESProject.Save
      # anywhere in this repository, and loading is the only path where the
      # clips are built inside the main context iteration rather than inside
      # the extraction - so a load that is not pumped fails this step rather
      # than passing quietly with an empty timeline.
      - name: GesLaunch (save and load a project)
        run: |
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 --save-only ges-launch-saved.xges +test-clip snow d=1.0
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -l ges-launch-saved.xges

      # Rendering, on the only leg whose encoders are proven: theoraenc,
      # vorbisenc and oggmux are in GSTSHARP_REQUIRED_ELEMENTS above, so the
      # theora+vorbis in ogg the sample falls back to when neither --format nor
      # the output extension names a profile is really installed here. The
      # discoverer then has to accept the file that came out, which is what
      # turns "the render mode ran" into "the render mode produced media".
      - name: GesLaunch (render)
        run: |
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -o "file://$PWD/ges-render.ogg" +test-clip snow d=1.0
          dotnet run --project samples/GstDiscoverer --no-build -- --fail-on-error ges-render.ogg

      # The three paths that pick an encoding profile without --format, all of
      # them chained after the render step above because two of them need a
      # real, discoverable file and ges-render.ogg is the only one any leg
      # produces. Every one of these paths ends in an ogg, so the file existing
      # proves nothing: what makes each step a gate is the line the sample
      # prints saying which path answered, which is grepped for below. The
      # default shell of a run: step is "bash -e" without pipefail, so each of
      # them turns pipefail on: piping the sample into tee would otherwise
      # hide its exit code, and a run that timed out after printing the line
      # would pass the grep with a truncated file.
      - name: GesLaunch (container profile)
        run: |
          set -o pipefail
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -o "file://$PWD/ges-container.ogg" -f "application/ogg:video/x-theora:audio/x-vorbis" --container-profile "application/ogg" +test-clip snow d=1.0 | tee ges-container.log
          grep -q -- "Re-parented the encoding profile into --container-profile application/ogg" ges-container.log
          dotnet run --project samples/GstDiscoverer --no-build -- --fail-on-error ges-container.ogg

      # --profile-from also rebuilds the track topology out of the discoverer
      # information of the named clip, so a run that picked the profile some
      # other way would have rendered from the wrong tracks as well.
      - name: GesLaunch (profile from a named clip)
        run: |
          set -o pipefail
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -o "file://$PWD/ges-profile-from.ogg" --profile-from src +clip "file://$PWD/ges-render.ogg" name=src d=1.0 | tee ges-profile-from.log
          grep -q -- "Encoding profile from: --profile-from src" ges-profile-from.log
          dotnet run --project samples/GstDiscoverer --no-build -- --fail-on-error ges-profile-from.ogg

      # Smart rendering with neither --format nor a project profile, which is
      # the get_smart_profile path. The candidate count in the line is part of
      # the gate: a run that found no candidate would fall back to the file
      # extension and still write an ogg.
      #
      # The gate stops at the profile pick. The GES 1.24 of this leg cannot
      # smart-render the picked theora+vorbis profile back into ogg: the
      # passthrough branch inside encodebin ends in a not-linked queue and the
      # pipeline errors out after the line was printed (GStreamer 1.28.6 renders
      # the same command to a byte-identical copy of the input). The pick is
      # what the sample owns, so the exit code of the run is not part of this
      # step and the output file is not inspected; the pipefail the other steps
      # set is left out here for that reason.
      - name: GesLaunch (smart rendering profile)
        run: |
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 --smart-rendering -o "file://$PWD/ges-smart.ogg" +clip "file://$PWD/ges-render.ogg" d=1.0 | tee ges-smart.log
          grep -q -- "Encoding profile from: smart rendering (1 candidate profiles)" ges-smart.log

      # A project that carries another project as a clip. The inner one is
      # ges-launch-saved.xges from the save and load step above, on this same
      # job, and the only .xges written before this step; the run here puts it
      # on a timeline, and --embed-nesteds then registers it as an asset of the
      # outer project. The count in the line is the gate: without the embedding
      # the save would write the same outer project with a nested count of
      # zero, so it is the number and not the file that says the path ran. The
      # load that follows is the other half - a nested project is only really
      # embedded if the saved file plays back again.
      #
      # This step is Linux only, unlike the rest of the GesLaunch steps: a
      # nested .xges clip is played through the gesdemux element, and on
      # Windows gesdemux fails writing its temporary timeline description file
      # (gesdemux.c:551-562 keeps the fd from g_file_open_tmp open while
      # g_file_set_contents replaces the same path, which cannot be renamed
      # over while a handle on it is open). The sample is not what fails there,
      # so the fixture is simply not run on the Windows legs.
      - name: GesLaunch (embed nested timelines)
        run: |
          set -o pipefail
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 --save-only ges-nested.xges --embed-nesteds +clip "file://$PWD/ges-launch-saved.xges" d=1.0 | tee ges-nested.log
          grep -q "Embedded nested projects: 1" ges-nested.log
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -l ges-nested.xges

      # The inspect-lite port, run the two ways it can be run. The census walks
      # the whole registry and needs no plugin in particular; the element page
      # is asked for fakesink, which is in the core elements every leg has, and
      # exits 1 for a name the registry does not know — which is what makes the
      # second line a gate rather than a print. This step runs on all four
      # native legs, because what it exercises is the registry surface and that
      # is where the three installations differ most.
      - name: GstInspect
        run: |
          dotnet run --project samples/GstInspect --no-build
          dotnet run --project samples/GstInspect --no-build -- fakesink

      # The gate the sample exists for: the page it prints has to be the page
      # the real tool prints, byte for byte. What is compared, why these six
      # elements, and why the diff is skipped rather than failed on a leg whose
      # gst-inspect-1.0 predates the 1.28.3 page format the port reproduces is
      # written down in the script, which the four native legs share. In
      # practice the diff runs on the legs whose gst-inspect-1.0 is 1.28.3 or
      # newer -- macOS and the Windows MinGW leg today -- and is skipped with a
      # warning elsewhere, this leg among them: it installs the tool of the
      # distribution, which is older than that.
      - name: GstInspect against gst-inspect-1.0
        run: .github/scripts/gst-inspect-diff.sh

      # The WebRTC sample: two webrtcbin elements in one pipeline negotiate a
      # call with each other and the receiving one decodes what the sending one
      # payloads into an appsink. It runs on this leg alone, because this is the
      # only leg that installs the webrtc and nice plugins — the Windows MinGW
      # leg installs the libraries of the bad plugins without the plugins
      # themselves, and macOS and the MSVC leg have neither — so webrtcbin is
      # not in the registry anywhere else and the sample would exit 1 naming
      # it. --timeout 90 rather than the default: what has to fit in it is the
      # DTLS handshake and the ICE pairing of two agents on a loopback, on a
      # hosted runner that is slower than a development machine, and the
      # deadline is what ends a call that never pairs. --print-sdp puts the
      # offer and the answer on the log, which is what a failed negotiation is
      # read from afterwards.
      - name: WebRtcLoopback
        run: dotnet run --project samples/WebRtcLoopback --no-build -- --buffers 100 --timeout 90 --print-sdp

      # The gst-device-monitor port. A hosted runner has no capture or playback
      # hardware, so finding zero devices is the expected outcome and is exit 0,
      # exactly as it is for the C tool. What is being gated is that the monitor
      # starts at all: gst_device_monitor_start returns FALSE, and the tool -1,
      # when no device provider matches the filters, so this would catch a leg
      # that lost its providers.
      #
      # Video/Source is not cosmetic. The pulse provider of gst-plugins-good —
      # which ships inside the plugins-good package this job installs, so it is
      # here whether or not anything asks for it — waits in start on a
      # PulseAudio context that a headless session never gives it, and two
      # earlier attempts at this step sat there until the job timed out.
      # gst_device_monitor_add_filter matches the filter's classes against each
      # factory's klass with a per-segment AND and instantiates only the
      # factories that match, so Video/Source selects v4l2 (Source/Sink/Video)
      # and pulse (Sink/Source/Audio) is never constructed, let alone started.
      # Any Audio/... filter would bring it back. timeout-minutes bounds that
      # failure mode should some future provider wait on a daemon of its own.
      #
      # Both runs go through Start, so both take the v4l2 provider's udev thread
      # start path; the second one additionally exercises the bounded follow
      # loop. The first ends the listing on the first empty poll rather than on
      # DEVICE_MONITOR_STARTED, because this leg's 1.24 does not have that
      # message — see the sample.
      - name: GstDeviceMonitor
        timeout-minutes: 5
        run: |
          dotnet run --project samples/GstDeviceMonitor --no-build -- Video/Source
          dotnet run --project samples/GstDeviceMonitor --no-build -- --follow --follow-for 3 Video/Source

      # The Linux half of the NativeAOT promise. Both AOT gates used to run on
      # win-x64 alone, which left the ILC toolchain, the native link and the
      # SONAME resolution of a published binary — an executable with no host and
      # no deps.json beside it — unmeasured on the other platform the binding
      # claims. eng/aot-gate.ps1 is RID agnostic (the only thing it decides from
      # the RID is the .exe suffix of the file it runs), pwsh is on the ubuntu
      # images, and what ILC needs to link, clang and zlib, is preinstalled
      # there as well. The run half of the gate has a library to load because
      # this job installed one, and AotSmoke needs nothing beyond it: core,
      # base, audio, video, controller and the fakesink of the core elements.
      #
      # Only AotSmoke is gated here, and not the AppSinkSpans gate the MSVC job
      # runs beside it. What the second gate measures is the GType registry
      # under full trimming, and that is a decision ILC makes from the same IL
      # on every RID; what is genuinely per-RID is loading and linking, which
      # AotSmoke covers — it initialises, resolves its own LibraryImport stubs,
      # runs the managed subclasses of the sample — an element, a source and
      # sink pair, an audio sink, a video sink, an audio encoder and an element
      # an element factory made — and reaches into a second binding module. A
      # second ILC publish would roughly double the minutes this leg spends to
      # say that again.
      #
      # Last of the steps on purpose: an ILC publish takes minutes, and a plain
      # test or sample failure belongs on the log before it, not behind it.
      # Only the failure upload follows it.
      - name: NativeAOT smoke (linux-${{ matrix.arch }})
        shell: pwsh
        run: ./eng/aot-gate.ps1 -Project samples/AotSmoke -Rid linux-${{ matrix.arch }}

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-linux-${{ matrix.arch }}
          # artifacts/logs is where aot-gate.ps1 tees the publish output, so a
          # failed AOT gate leaves the same artifact behind here as on the MSVC
          # job.
          path: |
            artifacts/test-results
            artifacts/logs
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # macOS: the dylib file names and the Homebrew directory of the unix planner.
  # --------------------------------------------------------------------------
  macos:
    name: macos (GStreamer from Homebrew)
    runs-on: macos-latest
    env:
      HOMEBREW_NO_ENV_HINTS: 1
      HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-dotnet: the image's own SDK, resolved through global.json.
      # See the verify job.
      - name: Show the SDK
        run: dotnet --version

      # The formula bundles core, base, good, bad, ugly and libav, and installs
      # into /opt/homebrew/lib on the arm64 runners, which is one of the
      # directories NativeInstallPlanner.EnumerateUnixDirectories tries. The
      # editing services are part of it as well — the formula absorbed the
      # former gst-editing-services one and links lib/libges* — so the GES job
      # needs nothing of its own here.
      - name: Install GStreamer
        run: |
          brew install gstreamer
          gst-inspect-1.0 --version

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      - name: Test the runtime
        run: dotnet test tests/GstSharp.Core.Tests --no-build --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      - name: Test against the installation
        run: dotnet test tests/GstSharp.IntegrationTests --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      - name: AppSinkSpans
        run: dotnet run --project samples/AppSinkSpans --no-build -- --mode pull

      # The RTP module on the same route: a payloader feeding an appsink, every
      # header read through a mapped RTPBuffer, and a compound RTCP packet
      # built and read back.
      - name: RtpPacketDump
        run: dotnet run --project samples/RtpPacketDump --no-build

      # Same run as the Linux leg; see the comments there.
      - name: CustomMeta
        run: dotnet run --project samples/CustomMeta --no-build

      - name: GstLaunch
        run: dotnet run --project samples/GstLaunch --no-build -- videotestsrc num-buffers=100 ! fakesink

      # Same two ports as the Linux leg; see the comments there. The device
      # provider that keeps the monitor startable here is osxaudio, out of
      # gst-plugins-good, which the formula bundles.
      - name: GstTypefind
        run: |
          dotnet run --project samples/GstLaunch --no-build -- -q audiotestsrc num-buffers=50 ! wavenc ! filesink location=typefind-sample.wav
          dotnet run --project samples/GstTypefind --no-build -- --fail-on-unknown typefind-sample.wav

      # Same two steps as the Linux leg; see the comments there.
      - name: GstStats trace
        env:
          GST_TRACERS: stats;rusage;latency(flags=pipeline+element+reported);factories
          GST_DEBUG: GST_TRACER:7
          GST_DEBUG_FILE: gst-stats-trace.log
          GST_DEBUG_NO_COLOR: "1"
        run: dotnet run --project samples/GstLaunch --no-build -- -q videotestsrc num-buffers=50 ! videoconvert ! fakesink

      - name: GstStats
        run: dotnet run --project samples/GstStats --no-build -- --fail-if-empty gst-stats-trace.log

      # Same port as the Linux leg; see the comments there. The media here is
      # the wav the step above made rather than the ogg, which only the Linux
      # leg builds.
      - name: GstPlay
        run: |
          dotnet run --project samples/GstPlay --no-build -- --duration 2 --videosink fakesink --audiosink fakesink typefind-sample.wav
          dotnet run --project samples/GstPlay --no-build -- --list-visualizations
          printf '# the sample skips this line and every blank one\n%s\n' typefind-sample.wav > play-list.txt
          dotnet run --project samples/GstPlay --no-build -- --duration 2 --videosink fakesink --audiosink fakesink --flags video+audio+soft-volume --playlist play-list.txt

      # Same run as the Linux leg; see the comments there.
      - name: PlaybinPlayer
        run: dotnet run --project samples/PlaybinPlayer --no-build -- --timeout 30

      # Same run as the Linux leg; see the comments there.
      - name: RtspServer
        run: dotnet run --project samples/RtspServer --no-build -- --port 0 --timeout 5

      # Same run as the Linux leg; see the comments there.
      - name: RtspClient
        run: dotnet run --project samples/RtspClient --no-build -- --buffers 100 --timeout 60

      # Same run as the Linux leg; see the comments there.
      - name: GesCustomSource
        run: dotnet run --project samples/GesCustomSource --no-build -- --timeout 20

      # Same three runs as the Linux leg; see the comments there. The render
      # run stays on Linux, where the theora, vorbis and ogg elements it needs
      # are the ones CI already requires.
      - name: GesLaunch (playback)
        run: dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 +test-clip snow d=1.0 +test-clip smpte d=1.0

      - name: GesLaunch (list transitions)
        run: dotnet run --project samples/GesLaunch --no-build -- --no-interactive --timeout 30 --list-transitions

      - name: GesLaunch (save and load a project)
        run: |
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 --save-only ges-launch-saved.xges +test-clip snow d=1.0
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -l ges-launch-saved.xges

      # No filter here: the osxaudio provider comes up without a daemon to wait
      # for, so the full listing is safe. See the Linux step for why that leg
      # filters.
      - name: GstDeviceMonitor
        run: dotnet run --project samples/GstDeviceMonitor --no-build

      # Same two runs as the Linux leg; see the comments there.
      - name: GstInspect
        run: |
          dotnet run --project samples/GstInspect --no-build
          dotnet run --project samples/GstInspect --no-build -- fakesink

      # Same script as the Linux leg; see the comments there and in the script.
      # This leg's gst-inspect-1.0 is newer than 1.28.3, so the diff really
      # runs here rather than being skipped.
      - name: GstInspect against gst-inspect-1.0
        run: .github/scripts/gst-inspect-diff.sh

      # The same gate as the Linux leg, for the third RID the binding claims;
      # see the comments there for why only AotSmoke is gated outside the MSVC
      # job. macos-latest is arm64, so the RID is osx-arm64, and eng/aot-gate.ps1
      # needs nothing else: the only thing it decides from a RID is the .exe
      # suffix of the file it runs. Nothing is passed to the published binary
      # either, exactly as on the other legs — it finds the Homebrew library
      # through the /opt/homebrew/lib directory of the planner, which is what
      # every step above already relies on.
      #
      # Last of the steps on purpose: an ILC publish takes minutes, and a plain
      # test or sample failure belongs on the log before it, not behind it.
      # Only the failure upload follows it.
      - name: NativeAOT smoke (osx-arm64)
        shell: pwsh
        run: ./eng/aot-gate.ps1 -Project samples/AotSmoke -Rid osx-arm64

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-macos
          # artifacts/logs is where aot-gate.ps1 tees the publish output, so a
          # failed AOT gate leaves the same artifact behind here as on the
          # Linux and MSVC jobs.
          path: |
            artifacts/test-results
            artifacts/logs
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Windows, MinGW flavor. MSYS2 is how the maintainer's machine is set up and
  # the only way to get the "lib" prefixed Windows file names under test. The
  # installation is deliberately not announced through an environment variable:
  # putting mingw64\bin on PATH is exactly what the MSYS2 branch of
  # NativeInstallPlanner has to recognize.
  # --------------------------------------------------------------------------
  windows-mingw:
    name: windows (MinGW from MSYS2)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-dotnet: the image's own SDK, resolved through global.json.
      # See the verify job.
      - name: Show the SDK
        run: dotnet --version

      # The two Windows legs are the only jobs with a NuGet cache: a cold
      # dotnet restore costs 32 to 73 seconds on Windows, measured over two
      # runs, against about 10 warm plus a 25 second cache download - slow and
      # noisy enough to be worth covering. A cold restore on the other legs
      # takes 8 to 13 seconds (macos 8, linux 11, verify 13), against about 5
      # warm plus a 3 to 10 second download, so there the cache breaks even at
      # best and those jobs have none. eng/ci-notes.md has the numbers.
      #
      # The flavor is in the key because runner.os is Windows on this job and
      # on windows-msvc-aot alike, and a cache entry is immutable once written:
      # with one shared key the leg that saved first would decide what the
      # other restores, and the ILCompiler packs of the MSVC leg would never be
      # cached at all.
      #
      # Restore here, save as the last step before the failure upload, and only
      # on main. A cache written on a branch is visible to that branch only,
      # while a branch, a pull request and a tag all fall back to the default
      # branch's caches - so only main's entries are ever read by anyone else.
      # A workflow_dispatch run on a feature branch, and a pull_request run
      # under refs/pull/N/merge, each used to save a full duplicate set under
      # the same keys, invisible to main, which then saved its own. That is
      # what pushed the repository against the 10 GB cache limit, where GitHub
      # starts evicting entries that are still in use.
      #
      # Saving last rather than beside the restore is deliberate: on the MSVC
      # leg the ILCompiler and the runtime packs only enter ~/.nuget/packages
      # when the publish at the end of the job restores them, so a save next to
      # the restore step would cache everything except the heaviest part. There
      # is no explicit success() either: the implicit one means a job that
      # failed saves nothing, and a half filled package directory never becomes
      # the entry the next run starts from.
      #
      # cache-hit != 'true' skips the save when the primary key already exists;
      # writing it again is rejected anyway.
      - name: Restore the NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-mingw-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-mingw-

      - name: Install MSYS2 with GStreamer
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: false
          path-type: minimal
          # The -libs half of the bad plugins carries libgstwebrtc-1.0-0.dll and
          # little else; the plugins themselves are not under test and would
          # pull in fifty more packages. The editing services have no such
          # split: one package carries libges-1.0-0.dll together with the nle
          # and ges plugins, and the GES tests need both halves. The RTSP
          # server is a package of its own as well, and it carries the
          # libgstrtspserver-1.0-0.dll the GstRtspServer module imports from.
          install: >-
            mingw-w64-x86_64-gstreamer
            mingw-w64-x86_64-gst-plugins-base
            mingw-w64-x86_64-gst-plugins-good
            mingw-w64-x86_64-gst-plugins-bad-libs
            mingw-w64-x86_64-gst-rtsp-server
            mingw-w64-x86_64-gst-editing-services

      # The planner walks PATH, recognizes the msys64 root inside the entry and
      # probes ucrt64\bin, mingw64\bin and clang64\bin below it. Prepending the
      # directory also lets the plugins find their own dependencies.
      - name: Put the MinGW installation on PATH
        shell: pwsh
        run: |
          $bin = Join-Path '${{ steps.msys2.outputs.msys2-location }}' 'mingw64\bin'
          if (-not (Test-Path (Join-Path $bin 'libgstreamer-1.0-0.dll'))) {
            throw "No MinGW GStreamer below $bin."
          }
          Write-Host "MinGW GStreamer: $bin"
          & (Join-Path $bin 'gst-inspect-1.0.exe') --version
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      - name: Test the runtime
        run: dotnet test tests/GstSharp.Core.Tests --no-build --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results

      - name: Test against the installation
        run: dotnet test tests/GstSharp.IntegrationTests --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test-results --blame-hang --blame-hang-timeout 5m --blame-hang-dump-type mini

      # Also the diagnostic of this job: the sample prints which flavor and
      # which directory the loader pinned, so a detection change shows up in
      # the log even while the tests still pass.
      - name: AppSinkSpans
        run: dotnet run --project samples/AppSinkSpans --no-build -- --mode pull

      # The RTP module on the same route: a payloader feeding an appsink, every
      # header read through a mapped RTPBuffer, and a compound RTCP packet
      # built and read back.
      - name: RtpPacketDump
        run: dotnet run --project samples/RtpPacketDump --no-build

      # Same run as the Linux leg; see the comments there.
      - name: CustomMeta
        run: dotnet run --project samples/CustomMeta --no-build

      # The Windows half of the gst-launch port: this is the only leg where the
      # multimedia timer is raised, and the sample says which precision it got
      # on its first line.
      - name: GstLaunch
        run: dotnet run --project samples/GstLaunch --no-build -- videotestsrc num-buffers=100 ! fakesink

      # Same port as the Linux leg; see the comments there. The relative
      # location= path keeps the two lines identical across bash and pwsh, and
      # dotnet run leaves the working directory at the repository root on both.
      - name: GstTypefind
        run: |
          dotnet run --project samples/GstLaunch --no-build -- -q audiotestsrc num-buffers=50 ! wavenc ! filesink location=typefind-sample.wav
          dotnet run --project samples/GstTypefind --no-build -- --fail-on-unknown typefind-sample.wav

      # Same two steps as the Linux leg; see the comments there.
      # There is no rusage tracer in the MinGW build -- gstrusage.c needs the
      # getrusage of POSIX -- so the log carries no thread-rusage or
      # proc-rusage record here and the report has no CPU load line.
      - name: GstStats trace
        env:
          GST_TRACERS: stats;latency(flags=pipeline+element+reported);factories
          GST_DEBUG: GST_TRACER:7
          GST_DEBUG_FILE: gst-stats-trace.log
          GST_DEBUG_NO_COLOR: "1"
        run: dotnet run --project samples/GstLaunch --no-build -- -q videotestsrc num-buffers=50 ! videoconvert ! fakesink

      - name: GstStats
        run: dotnet run --project samples/GstStats --no-build -- --fail-if-empty gst-stats-trace.log

      # Same port as the Linux leg; see the comments there. This is also where
      # libgstplay-1.0-0.dll, the "lib" prefixed MinGW file name of the module,
      # is loaded outside the test suite.
      - name: GstPlay
        # The runners default to pwsh on Windows, which only propagates the
        # exit code of the last line; the first two runs would not gate. It is
        # also what makes the printf below portable on this leg.
        shell: bash
        run: |
          dotnet run --project samples/GstPlay --no-build -- --duration 2 --videosink fakesink --audiosink fakesink typefind-sample.wav
          dotnet run --project samples/GstPlay --no-build -- --list-visualizations
          printf '# the sample skips this line and every blank one\n%s\n' typefind-sample.wav > play-list.txt
          dotnet run --project samples/GstPlay --no-build -- --duration 2 --videosink fakesink --audiosink fakesink --flags video+audio+soft-volume --playlist play-list.txt

      # Same run as the Linux leg; see the comments there.
      - name: PlaybinPlayer
        run: dotnet run --project samples/PlaybinPlayer --no-build -- --timeout 30

      # Same run as the Linux leg; see the comments there.
      - name: RtspServer
        run: dotnet run --project samples/RtspServer --no-build -- --port 0 --timeout 5

      # Same run as the Linux leg; see the comments there.
      - name: RtspClient
        run: dotnet run --project samples/RtspClient --no-build -- --buffers 100 --timeout 60

      # Same run as the Linux leg; see the comments there.
      - name: GesCustomSource
        run: dotnet run --project samples/GesCustomSource --no-build -- --timeout 20

      # Same three runs as the Linux leg; see the comments there. The render
      # run stays on Linux, where the theora, vorbis and ogg elements it needs
      # are the ones CI already requires.
      - name: GesLaunch (playback)
        run: dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 +test-clip snow d=1.0 +test-clip smpte d=1.0

      - name: GesLaunch (list transitions)
        run: dotnet run --project samples/GesLaunch --no-build -- --no-interactive --timeout 30 --list-transitions

      - name: GesLaunch (save and load a project)
        # The runners default to pwsh on Windows, which only propagates the
        # exit code of the last line; a save that failed would pass here.
        shell: bash
        run: |
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 --save-only ges-launch-saved.xges +test-clip snow d=1.0
          dotnet run --project samples/GesLaunch --no-build -- --no-interactive --videosink fakesink --audiosink fakesink --timeout 30 -l ges-launch-saved.xges

      # Same two runs as the Linux leg; see the comments there.
      - name: GstInspect
        run: |
          dotnet run --project samples/GstInspect --no-build
          dotnet run --project samples/GstInspect --no-build -- fakesink

      # Same script as the Linux leg; see the comments there and in the script.
      # The MinGW gst-inspect-1.0 of this leg is 1.28.3 or newer, so the diff
      # really runs here rather than being skipped.
      - name: GstInspect against gst-inspect-1.0
        # The runners default to pwsh on Windows, and the script is a shell
        # script; Git Bash is on the image.
        shell: bash
        run: .github/scripts/gst-inspect-diff.sh

      # No GstDeviceMonitor on this leg: no device provider comes up on it.
      # The practical Windows providers, wasapi2 among them, live in the bad
      # plugins, which this job deliberately installs as libraries only, and
      # the directsound provider of gst-plugins-good does not register in a
      # headless session - the first run proved it by failing to start.

      # Restored at the top of the job, written here and on main only; the
      # comment on the restore step says why. Last step before the failure
      # upload, like the MSVC leg's.
      - name: Save the NuGet cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Upload test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-windows-mingw
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------------------
  # Windows, MSVC flavor: the official installer plus the two NativeAOT gates.
  # --------------------------------------------------------------------------
  windows-msvc-aot:
    name: windows (MSVC installer, NativeAOT)
    runs-on: windows-latest
    timeout-minutes: 40

    env:
      GSTREAMER_VERSION: '1.28.6'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-dotnet: the image's own SDK, resolved through global.json.
      # See the verify job.
      - name: Show the SDK
        run: dotnet --version

      # The flavor is in the key because runner.os is Windows on this job and
      # on windows-mingw alike, and a cache entry is immutable once written:
      # with one shared key the leg that saved first would decide what the
      # other restores, and this is the leg whose ILCompiler and runtime packs
      # are the ones worth caching. The mingw job's restore step carries the
      # rest of the reasoning.
      #
      # Restore only; the save is the last step before the failure upload.
      - name: Restore the NuGet cache
        id: nuget-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-msvc-${{ hashFiles('**/Directory.Packages.props', '**/Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-msvc-

      # The installer does not change for a pinned version, so downloading it
      # once per week of cache lifetime is enough. Restore and save are split
      # the same way the NuGet cache's are, and for the same reason: main is
      # the only branch whose caches anyone else reads, so a branch, a
      # workflow_dispatch or a pull_request run that saved one only duplicated
      # it for nobody. The save is right after the install step rather than at
      # the end of the job because that is where the download exists; nothing
      # later adds to it.
      - name: Restore the GStreamer installer cache
        id: gstreamer-installer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\gstreamer-download
          key: gstreamer-msvc-x86_64-${{ env.GSTREAMER_VERSION }}

      - name: Install GStreamer (MSVC)
        shell: pwsh
        run: >
          ./eng/install-gstreamer-windows.ps1
          -Version $env:GSTREAMER_VERSION
          -Flavor msvc
          -DownloadDirectory "$env:RUNNER_TEMP\gstreamer-download"

      - name: Save the GStreamer installer cache
        if: ${{ github.ref == 'refs/heads/main' && steps.gstreamer-installer-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\gstreamer-download
          key: ${{ steps.gstreamer-installer-cache.outputs.cache-primary-key }}

      - name: Restore
        run: dotnet restore GstSharp.Net.slnx

      - name: Build
        run: dotnet build GstSharp.Net.slnx --no-restore

      # Gate 1: nothing the runtime does may produce a trimming or an AOT
      # warning, and the published executable has to reach the native library.
      - name: NativeAOT smoke
        shell: pwsh
        run: ./eng/aot-gate.ps1 -Project samples/AotSmoke -Rid win-x64

      # Gate 2: ParseLaunch plus GetByName-as-AppSink under
      # full trimming. A missing GType registration fails as a null cast at run
      # time and not as a build warning, so the gate is the exit code of the
      # published executable.
      - name: NativeAOT type registry
        shell: pwsh
        run: >
          ./eng/aot-gate.ps1
          -Project samples/AppSinkSpans
          -Rid win-x64
          -Property InvariantGlobalization=true
          -RunArguments '--mode','pull'

      # Restored at the top of the job, written here and on main only; the
      # comment on the mingw job's restore step says why. The ILCompiler and
      # runtime packs the two gates above restore are the reason this is the
      # last step before the failure upload.
      - name: Save the NuGet cache
        if: ${{ github.ref == 'refs/heads/main' && steps.nuget-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ steps.nuget-cache.outputs.cache-primary-key }}

      - name: Upload publish logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publish-logs-windows-msvc
          path: artifacts/logs
          if-no-files-found: ignore
          retention-days: 7
